<html lang="bn" data-theme="light">

<head>

    <!-- =========================================

    ========================================== -->

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"

        content="LittleQuest — শিশুদের জন্য Class-wise Subject learning."
    >

    <meta
        name="robots"
        content="index, follow"
    >

    <meta
        name="theme-color"
        content="#92003A"
    >

    <title id="lqPageTitle">
        LittleQuest — Subject
    </title>


    <!-- =========================================
         SEO / Social Sharing
    ========================================== -->

    <link
        rel="canonical"
        id="lqCanonical"
        href="https://littlequest.ytboostkit.workers.dev/subject.html"
    >

    <meta
        property="og:type"
        content="website"
    >

    <meta
        property="og:title"
        id="lqOgTitle"
        content="LittleQuest — Subject"
    >

    <meta
        property="og:description"
        id="lqOgDescription"
        content="LittleQuest — শিশুদের জন্য সহজ ও সুন্দর Subject learning."
    >

    <meta
        property="og:url"
        id="lqOgUrl"
        content="https://littlequest.ytboostkit.workers.dev/subject.html"
    >

    <meta
        property="og:site_name"
        content="LittleQuest"
    >

    <meta
        property="og:locale"
        content="bn_IN"
    >

    <meta
        name="twitter:card"
        content="summary"
    >

    <meta
        name="twitter:title"
        id="lqTwitterTitle"
        content="LittleQuest — Subject"
    >

    <meta
        name="twitter:description"
        id="lqTwitterDescription"
        content="LittleQuest — শিশুদের জন্য সহজ ও সুন্দর Subject learning."
    >


    <!-- =========================================
         Global CSS
    ========================================== -->

    <link
        rel="stylesheet"
        href="assets/css/global.css"
    >

    <link
        rel="stylesheet"
        href="assets/css/components.css"
    >

    <link
        rel="stylesheet"
        href="assets/css/responsive.css"
    >

    <link
        rel="icon"
        type="image/svg+xml"
        href="assets/favicon.svg"
    >


    <!-- =========================================
         Font
    ========================================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap"
        rel="stylesheet"
    >

</head>


<body>

    <!-- =========================================
         Global Header
    ========================================== -->

    <div
        data-component="header"
    ></div>


    <!-- =========================================
         Global Sidebar
    ========================================== -->

    <div
        data-component="sidebar"
    ></div>


    <!-- =========================================
         Main Content
    ========================================== -->

    <main class="lq-main">

        <div class="container">


            <!-- =====================================
                 Breadcrumbs
            ====================================== -->

            <div
                data-component="breadcrumbs"
            ></div>


            <!-- =====================================
                 Subject Hero
            ====================================== -->

            <section class="lq-home-hero lq-subject-page-hero">

                <div class="lq-home-hero-content">

                    <span
                        class="lq-home-badge"
                        id="lqSubjectClassBadge"
                    >
                        📚 Class
                    </span>

                    <h1 id="lqSubjectTitle">
                        Subject
                    </h1>

                    <p id="lqSubjectDescription">
                        এই বিষয় থেকে শেখা শুরু করো।
                    </p>

                </div>

            </section>


            <!-- =====================================
                 Chapters Section
            ====================================== -->

            <section class="lq-home-section">

                <div class="lq-section-heading">

                    <h2 id="lqChaptersHeading">
                        Chapters
                    </h2>

                    <p id="lqChaptersIntro">
                        এই বিষয়ের অধ্যায়গুলি বেছে নাও।
                    </p>

                </div>


                <div
                    id="lqChapterGrid"
                    class="lq-subject-grid"
                >
                    <!-- Chapters will be loaded here -->
                </div>

            </section>


        </div>

    </main>


    <!-- =========================================
         Global Footer
    ========================================== -->

    <div
        data-component="footer"
    ></div>


    <!-- =========================================
         JavaScript
    ========================================== -->

    <script src="assets/js/config.js"></script>

    <script src="assets/js/theme.js"></script>

    <script src="assets/js/language.js"></script>

    <script src="assets/js/translations.js"></script>

    <script src="assets/js/data-loader.js"></script>

    <script src="assets/js/analytics.js"></script>

    <script src="assets/js/components.js"></script>

    <script src="assets/js/navigation.js"></script>

    <script src="assets/js/subject.js"></script>

    <script src="assets/js/app.js"></script>


    <!-- =========================================
         Component Loader
    ========================================== -->

    <script>

        document.addEventListener(
            "DOMContentLoaded",
            function () {

                if (
                    window.LittleQuestComponents &&
                    typeof window.LittleQuestComponents.load ===
                        "function"
                ) {

                    window.LittleQuestComponents.load();

                }

            }
        );

    </script>

</body>

</html>
