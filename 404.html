<!DOCTYPE html>
<html lang="bn" data-theme="light">

<head>

    <!-- =========================================
         LittleQuest v1.0
         404 Error Page
    ========================================== -->

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="robots"
        content="noindex, follow"
    >

    <meta
        name="description"
        content="The requested LittleQuest page could not be found."
    >

    <title>
        Page Not Found — LittleQuest
    </title>


    <!-- Global CSS -->

    <link
        rel="stylesheet"
        href="assets/css/global.css"
    >

    <link
        rel="stylesheet"
        href="assets/css/components.css"
    >

    <link
        rel="stylesheet"
        href="assets/css/responsive.css"
    >

</head>


<body>

    <main
        class="lq-main"
        id="main-content"
    >

        <div class="container">

            <section
                class="lq-error-page"
                aria-labelledby="error-title"
            >

                <div
                    class="lq-error-code"
                    aria-hidden="true"
                >
                    404
                </div>

                <h1
					id="error-title"
					data-i18n="pageNotFoundTitle"
				>
					এই পৃষ্ঠাটি খুঁজে পাওয়া যায়নি
				</h1>

                <p data-i18n="pageNotFoundMessage">
					দুঃখিত! তুমি যে পৃষ্ঠাটি খুঁজছ,
					সেটি হয়তো সরানো হয়েছে অথবা
					ঠিকানাটি পরিবর্তন হয়েছে।
				</p>

                <a
                    href="index.html"
                    class="lq-button"
                >
                    ← LittleQuest Home
                </a>

            </section>

        </div>

    </main>


    <!-- Global JavaScript -->

    <script
        src="assets/js/config.js"
    ></script>
	<script
    src="assets/js/language.js"
	></script>

	<script
		src="assets/js/translations.js"
	></script>
    <script
        src="assets/js/theme.js"
    ></script>

    <script
        src="assets/js/analytics.js"
    ></script>

    <script
        src="assets/js/app.js"
    ></script>

</body>

</html>
