    <!-- =========================================
         Global Header
    ========================================== -->

    <div
        data-component="header"
    ></div>


    <!-- =========================================
         Mobile Navigation
    ========================================== -->
	
	<!-- Left Sidebar -->

	<div
		data-component="sidebar"
	></div>


    <!-- =========================================

    ========================================== -->

		<main class="lq-main">

			<div class="container">

				<div data-component="breadcrumbs"></div>

				<section class="lq-home-hero">

					<div class="lq-home-hero-content">

						<span class="lq-home-badge">
							📚 LittleQuest v1.0 • Learning for Every Child
						</span>

						<h1 data-i18n="kidsEducationLibrary">
							Kids Digital Education Library
						</h1>

						<p data-i18n="learningWorld">
							A beautiful learning world from Nursery to Class 5.
						</p>

					</div>

				</section>

				<section class="lq-home-section">

					<div class="lq-section-heading">

						<h2 data-i18n="classes">
							Classes
						</h2>

						<p data-i18n="chooseClass">
							Nursery থেকে Class 5 পর্যন্ত শেখার পথ বেছে নাও।
						</p>

					</div>

					<div id="lqClassGrid" class="lq-class-grid">
						<!-- Class cards will be loaded here -->
					</div>

				</section>

				<section class="lq-home-section">

					<div class="lq-section-heading">

						<h2 data-i18n="subjects">
							Subjects
						</h2>

						<p data-i18n="exploreSubjects">
							বিভিন্ন বিষয় থেকে শেখা শুরু করো।
						</p>

					</div>

					<div id="lqSubjectGrid" class="lq-subject-grid">
						<!-- Subject cards will be loaded here -->
					</div>

				</section>

			</div>

    <!-- =========================================
         Component Loader
    ========================================== -->

    <script>

        document.addEventListener(
            "DOMContentLoaded",
            function () {

                if (
                    window.LittleQuestComponents &&
                    typeof window.LittleQuestComponents.load === "function"
                ) {

                    window.LittleQuestComponents.load();

                }

            }
        );

    </script>
